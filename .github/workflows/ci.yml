name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned LANCommander source
        uses: actions/checkout@v4
        with:
          # The integration-boundary server plugin and Server.UI contracts are not upstream yet,
          # so this pins the fork commit that carries them. Repoint at LANCommander/LANCommander
          # once they merge.
          repository: aaronpowell/LANCommander
          ref: 3a8cec3ff5cdf7b3c71d5042117eb168865c1c0e
          path: lancommander

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install LANCommander.Server.UI frontend dependencies
        shell: pwsh
        working-directory: .\lancommander\LANCommander.Server.UI
        run: npm ci

      - name: Build LANCommander assemblies
        shell: pwsh
        run: |
          dotnet build .\lancommander\LANCommander.SDK\LANCommander.SDK.csproj -c Debug -f net10.0
          dotnet build .\lancommander\LANCommander.Server.Data\LANCommander.Server.Data.csproj -c Debug
          dotnet build .\lancommander\LANCommander.Server.Services\LANCommander.Server.Services.csproj -c Debug
          dotnet build .\lancommander\LANCommander.Server.ImportExport\LANCommander.Server.ImportExport.csproj -c Debug
          dotnet build .\lancommander\LANCommander.Server.Plugins\LANCommander.Server.Plugins.csproj -c Debug
          dotnet build .\lancommander\LANCommander.Server.UI\LANCommander.Server.UI.csproj -c Debug

      - name: Build and test plugin
        shell: pwsh
        run: |
          dotnet build .\LANCommander.RecompCatalog.slnx -c Debug -p:LANCommanderRoot="$env:GITHUB_WORKSPACE\lancommander"
          dotnet test .\LANCommander.RecompCatalog.Tests\LANCommander.RecompCatalog.Tests.csproj -c Debug --no-build -p:LANCommanderRoot="$env:GITHUB_WORKSPACE\lancommander"

      - name: Package plugin
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { '' }
          .\build\Package-Plugin.ps1 -Version $version -LANCommanderRoot "$env:GITHUB_WORKSPACE\lancommander"

      - uses: actions/upload-artifact@v4
        with:
          name: LANCommander.RecompCatalog.Plugin
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LANCommander.RecompCatalog.Plugin
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Recomp Catalog $GITHUB_REF_NAME" \
            --generate-notes
