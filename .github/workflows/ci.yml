name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned LANCommander source
        uses: actions/checkout@v4
        with:
          # The integration-boundary server plugin and Server.UI contracts are not upstream yet,
          # so this pins the fork commit that carries them. Repoint at LANCommander/LANCommander
          # once they merge.
          repository: aaronpowell/LANCommander
          ref: 3a8cec3ff5cdf7b3c71d5042117eb168865c1c0e
          path: lancommander

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install LANCommander.Server.UI frontend dependencies
        shell: pwsh
        working-directory: .\lancommander\LANCommander.Server.UI
        run: npm ci

      - name: Build LANCommander assemblies
        shell: pwsh
        run: |
          dotnet build .\lancommander\LANCommander.SDK\LANCommander.SDK.csproj -c Debug -f net10.0
          dotnet build .\lancommander\LANCommander.Packaging\LANCommander.Packaging.csproj -c Debug -f net10.0
          dotnet build .\lancommander\LANCommander.Server.Plugins\LANCommander.Server.Plugins.csproj -c Debug
          dotnet build .\lancommander\LANCommander.Server.UI\LANCommander.Server.UI.csproj -c Debug

      - name: Build and test prototype
        shell: pwsh
        run: |
          dotnet build .\Hex1bCatalog.slnx -c Debug -p:LANCommanderRoot="$env:GITHUB_WORKSPACE\lancommander"
          dotnet test .\Hex1bCatalog.Tests\Hex1bCatalog.Tests.csproj -c Debug --no-build -p:LANCommanderRoot="$env:GITHUB_WORKSPACE\lancommander"

      - name: Verify plugin does not ship host assemblies
        shell: pwsh
        run: |
          $output = ".\LANCommander.RecompCatalog.Plugin\bin\Debug\net10.0"
          $forbidden = @(
            "LANCommander.SDK.dll",
            "LANCommander.Server.Plugins.dll",
            "LANCommander.Server.UI.dll",
            "LANCommander.Packaging.dll",
            "LANCommander.Packaging.Abstractions.dll"
          )
          $copied = $forbidden | Where-Object { Test-Path (Join-Path $output $_) }
          $copied += Get-ChildItem $output -Filter "Radzen*.dll" | Select-Object -ExpandProperty Name
          if ($copied) {
            throw "Plugin output contains host assemblies: $($copied -join ', ')"
          }
