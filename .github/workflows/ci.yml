name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test plugin
        shell: pwsh
        run: |
          dotnet build .\LANCommander.RecompCatalog.slnx -c Debug
          dotnet test .\LANCommander.RecompCatalog.Tests\LANCommander.RecompCatalog.Tests.csproj -c Debug --no-build

      - name: Package plugin
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { '' }
          .\build\Package-Plugin.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: LANCommander.RecompCatalog.Plugin
          path: |
            artifacts/*.nupkg
            artifacts/*.nupkg.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LANCommander.RecompCatalog.Plugin
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Recomp Catalog $GITHUB_REF_NAME" \
            --generate-notes
