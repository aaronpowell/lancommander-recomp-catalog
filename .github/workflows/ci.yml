name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Interim: the plugin data contracts (LANCommander/LANCommander#475) are not in a published
      # prerelease yet, so pack LANCommander.SDK, Server.Plugins and Server.UI from the pinned commit
      # into the local feed. Remove these two steps once the contracts ship in a nuget.org prerelease.
      - name: Check out pinned LANCommander source
        uses: actions/checkout@v4
        with:
          repository: aaronpowell/LANCommander
          ref: 6c70c3cfdd041e2f74cd526cc101f8104a3349fc
          path: lancommander

      - name: Pack LANCommander packages into the local feed
        shell: pwsh
        run: .\build\Pack-LANCommanderPackages.ps1 -LANCommanderRoot "$env:GITHUB_WORKSPACE\lancommander"

      - name: Build and test plugin
        shell: pwsh
        run: |
          dotnet build .\LANCommander.RecompCatalog.slnx -c Debug
          dotnet test .\LANCommander.RecompCatalog.Tests\LANCommander.RecompCatalog.Tests.csproj -c Debug --no-build

      - name: Package plugin
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { '' }
          .\build\Package-Plugin.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: LANCommander.RecompCatalog.Plugin
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LANCommander.RecompCatalog.Plugin
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Recomp Catalog $GITHUB_REF_NAME" \
            --generate-notes
